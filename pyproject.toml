[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finpipe"
version = "0.1.0"
description = "Financial data engineering pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
  { name = "finpipe" }
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["finpipe*"]
exclude = ["tests*"]
